[build-system]
requires = [
    "nanobind>=2.2",
    "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "kinepet"
version = "0.3.1"
description = "TAC-based nonlinear fitting for dynamic PET two-tissue compartment models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "nanobind>=2.2",
    "pytest>=8.4.0",
    "scikit-build-core>=0.10",
]
docs = [
    "mkdocs>=1.6.1",
]
extra = [
    "lls>=0.5.0",
    "pandas>=3.0.2",
]

[[tool.uv.index]]
name = "salodev-index"
url = "https://pypi.salodev.no/simple/"
publish-url = "https://pypi.salodev.no/"
explicit = true

[tool.scikit-build]
wheel.packages = ["kinepet"]

[[tool.uv.index]]
url = "https://pypi.salodev.no/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
