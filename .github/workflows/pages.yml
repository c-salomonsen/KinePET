name: Publish Documentation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Release tag or reviewed documentation-only branch/commit to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.source_ref != ''
    uses: ./.github/workflows/docs.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      upload_pages: true

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
