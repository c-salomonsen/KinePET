name: Publish Distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repository:
        description: Package index (run on a version tag)
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  release_metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tag, version, and license
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_INDEX: ${{ inputs.repository || 'pypi' }}
        run: |
          test "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF"
          python scripts/check_release.py --tag "$RELEASE_TAG" --repository "$RELEASE_INDEX"

  tests:
    needs: release_metadata
    uses: ./.github/workflows/tests.yml

  distributions:
    needs: release_metadata
    uses: ./.github/workflows/wheels.yml

  publish:
    runs-on: ubuntu-latest
    needs: [tests, distributions]
    environment:
      name: ${{ inputs.repository || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Check distribution licenses and contents
        run: python scripts/check_distributions.py dist --require-license
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
