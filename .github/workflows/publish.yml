name: Publish Distributions

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tag, version, license, and release notes
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF"
          python scripts/check_release.py --tag "$RELEASE_TAG" --notes-output "$RUNNER_TEMP/release-notes.md"

  tests:
    needs: release_metadata
    uses: ./.github/workflows/tests.yml
    with:
      full_matrix: true

  docs:
    needs: release_metadata
    uses: ./.github/workflows/docs.yml
    with:
      upload_pages: true

  distributions:
    needs: release_metadata
    uses: ./.github/workflows/wheels.yml

  prepare_artifacts:
    name: Validate and save release artifacts
    runs-on: ubuntu-latest
    needs: [tests, docs, distributions]
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: release/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: release/dist
          merge-multiple: true
      - name: Check distribution licenses and contents
        run: python scripts/check_distributions.py release/dist --require-license
      - name: Check package metadata and README rendering
        run: |
          python -m pip install twine
          python -m twine check --strict release/dist/*
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --notes-output release/release-notes.md
      - name: Record distribution checksums
        working-directory: release/dist
        run: sha256sum * > ../SHA256SUMS
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 90

  testpypi:
    name: Publish to TestPyPI
    needs: prepare_artifacts
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/kinepet
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare_artifacts.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - name: Verify saved artifacts
        working-directory: release/dist
        run: sha256sum --check ../SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/dist/
          repository-url: https://test.pypi.org/legacy/

  draft_release:
    name: Prepare draft GitHub release
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    needs: [prepare_artifacts, testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare_artifacts.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - name: Create draft from the changelog
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, '');
            // The tag lookup endpoint excludes drafts; list releases with write access.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && !existing.draft) {
              throw new Error(`Release ${tag} is already published; do not republish this version.`);
            }
            // Preserve any notes the maintainer edited while reviewing a draft.
            const release = existing || (await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `KinePET ${tag}`,
              body: require('fs').readFileSync('release/release-notes.md', 'utf8'),
              draft: true,
              prerelease: /(?:a|b|rc)\d/.test(tag)
            })).data;
            await core.summary
              .addHeading('Ready for release review')
              .addLink('Review draft release notes', release.html_url)
              .addRaw('\n\nVerify the TestPyPI installation, then approve the pypi environment deployment.\n')
              .write();
            return release.id;

  pypi:
    name: Approve and publish to PyPI
    needs: [prepare_artifacts, draft_release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kinepet
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare_artifacts.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - name: Verify the artifacts tested on TestPyPI
        working-directory: release/dist
        run: sha256sum --check ../SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/dist/

  github_release:
    name: Publish GitHub release
    needs: [pypi, draft_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.draft_release.outputs.release_id }}
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const {data: release} = await github.rest.repos.getRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID)
            });
            if (release.tag_name !== tag) throw new Error("Release tag changed during review");
            if (release.draft) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: release.id, draft: false
              });
            }
            await core.summary.addLink('Published release', release.html_url).write();

  documentation:
    name: Publish released documentation
    needs: github_release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
