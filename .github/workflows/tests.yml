name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run Python tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest -q

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.11

      - name: Configure CMake
        run: cmake -S . -B build -DPython_EXECUTABLE="$(uv run --python 3.11 python -c 'import sys; print(sys.executable)')"

      - name: Build CLI and extension
        run: cmake --build build --parallel

      - name: Run C++ numerical tests
        run: ctest --test-dir build --output-on-failure

      - name: Check CLI and Python parity across model configurations
        run: uv run --python 3.11 python -m pytest -q tests/test_cli.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict
