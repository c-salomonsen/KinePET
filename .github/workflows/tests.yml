name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Test every supported Python version
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_matrix:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Python and C++ tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.full_matrix && '["3.11", "3.12", "3.13"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - name: Configure CMake
        run: cmake -S . -B build -DPython_EXECUTABLE="$(uv run --python ${{ matrix.python-version }} python -c 'import sys; print(sys.executable)')"
      - name: Build CLI and extension
        run: cmake --build build --parallel
      - name: Run C++ numerical tests
        run: ctest --test-dir build --output-on-failure
      - name: Run Python tests, including CLI parity
        run: uv run --python ${{ matrix.python-version }} python -m pytest -q
